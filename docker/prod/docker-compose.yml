services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starburger}
      POSTGRES_USER: ${POSTGRES_USER:-starburger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starburger}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starburger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  frontend-builder:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - frontend_bundles_prod:/output
    # Образ уже содержит собранные bundles; volume перекрывает /app/bundles,
    # поэтому копируем артефакты сборки в volume для backend/collectstatic.
    command: sh -c "cp -a /app/bundles/. /output/ && echo 'Frontend bundles copied'"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: sh -c "python manage.py migrate && gunicorn star_burger.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./media:/app/media
      - frontend_bundles_prod:/app/bundles
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-starburger}:${POSTGRES_PASSWORD:-starburger}@db:5432/${POSTGRES_DB:-starburger}
      DEBUG: "False"
    restart: always
    ports:
      - "127.0.0.1:8002:8000"

  static_collector:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: sh -c "python manage.py collectstatic --noinput && echo 'Static collected'"
    volumes:
      - ./staticfiles:/app/staticfiles
      - frontend_bundles_prod:/app/bundles
      - ./media:/app/media
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-starburger}:${POSTGRES_PASSWORD:-starburger}@db:5432/${POSTGRES_DB:-starburger}

volumes:
  postgres_data_prod:
  frontend_bundles_prod:
