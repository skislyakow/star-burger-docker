services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starburger}
      POSTGRES_USER: ${POSTGRES_USER:-starburger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starburger}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starburger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - frontend_bundles_prod:/app/bundles
    env_file:
      - .env
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/* && git init && git remote add origin https://github.com/skislyakow/star-burger.git && git fetch --depth=1 origin main && git checkout origin/main -- package.json package-lock.json && npm ci --no-audit --no-fund && git checkout origin/main && npm run build"

  backend:
    image: python:3.12-slim-bookworm
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PATH: /app/.venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: postgres://${POSTGRES_USER:-starburger}:${POSTGRES_PASSWORD:-starburger}@db:5432/${POSTGRES_DB:-starburger}
      DEBUG: "False"
    volumes:
      - ../../media:/app/media
      - frontend_bundles_prod:/app/bundles
      - ../../staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends curl build-essential libpq-dev git ca-certificates && rm -rf /var/lib/apt/lists/* && curl -LsSf https://astral.sh/uv/install.sh | sh && git init && git remote add origin https://github.com/skislyakow/star-burger.git && git fetch --depth=1 origin main && git checkout origin/main -- pyproject.toml uv.lock && uv sync --frozen --no-dev && git checkout origin/main && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn star_burger.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    restart: always
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  postgres_data_prod:
  frontend_bundles_prod:
