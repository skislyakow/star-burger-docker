services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starburger}
      POSTGRES_USER: ${POSTGRES_USER:-starburger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starburger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starburger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - frontend_bundles:/app/bundles
    command: sh -c "npm run watch"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./media:/app/media
      - frontend_bundles:/app/bundles
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-starburger}:${POSTGRES_PASSWORD:-starburger}@db:5432/${POSTGRES_DB:-starburger}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/dev/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_bundles:/app/bundles:ro
      - ./media:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_bundles:
  static_data:
