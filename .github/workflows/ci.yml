name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compose:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Prepare env files for config validation
        run: |
          cp .env.example docker/dev/.env
          cp .env.example .env

      - name: Validate dev compose
        run: docker compose -f docker/dev/docker-compose.yml config --quiet

      - name: Validate prod compose with deploy.sh invocation
        run: docker compose --project-directory . -f docker/prod/docker-compose.yml config --quiet

      - name: Validate deploy script syntax
        run: bash -n deploy/deploy.sh
